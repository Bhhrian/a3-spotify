<h1>Search Spotify</h1>

<!-- Search input -->
<input [(ngModel)]="searchString">

<!-- Search category -->
<select [(ngModel)]="searchCategory">
  <option *ngFor="let category of searchCategories"
          [value]="category">
    {{ category }}
  </option>
</select>

<!-- Search button -->
<button class="btn btn-light" (click)="search()">
  Search
</button>

<!-- Artist and Album results -->
<app-carousel
  *ngIf="resources && (searchCategory === 'artist' || searchCategory === 'album')"
  [resources]="resources"
  carouselId="searchCarousel">
</app-carousel>

<!-- Track results -->
<app-track-list
  *ngIf="resources && searchCategory === 'track'"
  [tracks]="$any(resources)">
</app-track-list>
