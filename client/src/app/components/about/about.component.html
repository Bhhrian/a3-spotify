<!-- Load Spotify profile information -->
<button class="btn btn-light" (click)="getAboutMe()">
  Load info about me
</button>

<!-- Display user's name -->
<h3>Logged in user: {{ name }}</h3>

<!-- Display profile picture -->
<img [src]="profile_pic" class="profile">

<p>
  <!-- Link to Spotify profile -->
  <a
    class="btn btn-light"
    [href]="profile_link"
    target="_blank"
    rel="noopener noreferrer">
    Open profile on Spotify
  </a>
</p>
